[project]
name = "meta-insights-harvester"
version = "0.1.0"
description = "Production-ready FastAPI service for extracting Meta advertising data with intelligent rate limiting and CSV export"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.0",
    "httptools>=0.7.1",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.38.0",
    "uvloop>=0.22.1",
    "marimo>=0.9.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "sqlalchemy>=2.0.0",
    "google-genai>=1.49.0",
    "pyzmq>=27.1.0",
]
